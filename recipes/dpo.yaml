# Direct Preference Optimization of the SFT model on UltraFeedback (full fine-tuning, standard sigmoid loss).

# Data
model_name_or_path: checkpoints/sft   # also the frozen reference model
dataset_name: HuggingFaceH4/ultrafeedback_binarized
num_eval_samples: 2000      # held-out pairs from the test split
max_length: 2048            # prompt + response; longer pairs are dropped, not truncated

# DPO
loss_type: [sigmoid]        # the original DPO loss
beta: 0.1                   # how far the model may move away from the reference model

# Optimisation
num_train_epochs: 1
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_steps: 0.1           # a value below 1 is a fraction of the total steps
per_device_train_batch_size: 16
gradient_accumulation_steps: 8    # 16 x 8 = 128 pairs per update
per_device_eval_batch_size: 16
bf16: true                  # bf16 compute, fp32 master weights
gradient_checkpointing: true
seed: 42

# Logging and saving
logging_steps: 10
eval_strategy: steps
eval_steps: 100
save_strategy: "no"         # only the final model is saved
report_to: wandb
run_name: dpo
output_dir: checkpoints/dpo
wandb_entity: maxence-debes-ml
wandb_project: small-llm-post-training
