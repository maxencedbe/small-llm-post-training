# GRPO of the DPO model on GSM8K with a verifiable reward (full fine-tuning, TRL defaults where possible).

# Model, data and reward
model_name_or_path: checkpoints/dpo
dataset_name: openai/gsm8k
reward: correctness         # "format" for the control run

# GRPO
num_generations: 8          # completions per problem (the group)
max_completion_length: 512  # GSM8K answers take ~125 tokens
temperature: 1.0
beta: 0.0                   # no KL penalty (TRL default)
loss_type: dapo             # TRL default

# Generation with vLLM on the same GPU as training
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.3

# Optimisation
learning_rate: 1.0e-6
lr_scheduler_type: constant_with_warmup
warmup_steps: 0.05          # a value below 1 is a fraction of the total steps
per_device_train_batch_size: 32
gradient_accumulation_steps: 4    # 32 x 4 = 128 completions = 16 problems x 8 per update
num_train_epochs: 1         # each training problem seen once (467 updates)
bf16: true                  # bf16 compute, fp32 master weights
gradient_checkpointing: true
seed: 42

# Logging and saving
logging_steps: 5
log_completions: true       # sample completions in W&B
save_strategy: "no"         # only the final model is saved
report_to: wandb
run_name: grpo-seed42
output_dir: checkpoints/grpo-seed42
wandb_entity: maxence-debes-ml
wandb_project: small-llm-post-training
